type: object
required:
  - _id
  - name
  - email
properties:
  _id:
    description: User's id
    type: string
    example: 65f1d1ee367eab0012efb123
  name:
    description: User's name
    type: string
    example: John Doe
  email:
    description: User's email
    type: string
    example: john@example.com
  createdAt:
    type: string
    format: date-time
    example: '2024-12-01T12:00:00.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2024-12-01T12:30:00.000Z'
